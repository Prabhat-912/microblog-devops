name: Microblog CI

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker Image
        run: |
          docker build \
            -t ghcr.io/prabhat-912/microblog-devops:latest \
            -t ghcr.io/prabhat-912/microblog-devops:${{ github.sha }} \
            .

      - name: Push Latest Image
        run: |
          docker push ghcr.io/prabhat-912/microblog-devops:latest

      - name: Push Commit SHA Image
        run: |
          docker push ghcr.io/prabhat-912/microblog-devops:${{ github.sha }}
