apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: flask-ingress

spec:
  ingressClassName: nginx

  rules:
    - host: microblog.test

      http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: flask-service

                port:
                  number: 5000
